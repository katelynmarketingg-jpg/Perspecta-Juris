services:
  - type: web
    name: perspecta-juris
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8788"
      - key: DATABASE_URL
        sync: false           # defina no painel do Render: a URI do Postgres (Supabase)
      # Endereço público do site. Sem isto o CORS aceita qualquer origem.
      # Ex.: https://perspecta-juris.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FILES_DIR
        value: /var/data/files
      - key: HUB_URL
        value: https://perspecta-hub.onrender.com
      # Porta /api/admin/* usada pela Perspecta Central. Sem esta variável a
      # porta responde 503 — é assim que ela nasce fechada.
      # Gere com `openssl rand -base64 48` e cole no painel do Render.
      - key: ADMIN_API_TOKEN
        sync: false
      # Acompanhamento automático dos processos no CNJ, rodando no servidor.
      - key: DATAJUD_SYNC_ENABLED
        value: "true"
      - key: DATAJUD_SYNC_INTERVALO_MIN
        value: "60"
    disk:
      name: juris-data
      mountPath: /var/data
      sizeGB: 2
