services:
  - type: web
    name: perspecta-juris
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8788"
      - key: DATABASE_URL
        sync: false           # defina no painel do Render: a URI do Postgres (Supabase)
      # Endereço público do site. Sem isto o CORS aceita qualquer origem.
      # Ex.: https://perspecta-juris.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FILES_DIR
        value: /var/data/files
      - key: HUB_URL
        value: https://perspecta-hub.onrender.com
    disk:
      name: juris-data
      mountPath: /var/data
      sizeGB: 2
